<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>状态递推：线性注意力 / Mamba-2 / Gated DeltaNet</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#656d76;--card:#f6f8fa;--border:#d0d7de;--pos:9,105,218;--neg:207,34,46;--accent:#0969da;--good:#1a7f37;--bad:#cf222e;}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8d96a0;--card:#161b22;--border:#30363d;--pos:68,147,248;--neg:248,81,73;--accent:#4493f8;--good:#3fb950;--bad:#f85149;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:12px}
h3{margin:4px 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
button,select{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.45}
.formula{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin:6px 0;overflow-wrap:anywhere}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;margin:3px 0}
.ctl input[type=range]{flex:1;min-width:0}
.ctl b{min-width:36px;text-align:right}
.seq{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.tk{border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:12.5px;background:var(--bg)}
.tk.done{opacity:.55}
.tk.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);opacity:1}
.mats{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.mat{display:grid;gap:2px}
.mat div{width:34px;height:28px;font-size:10.5px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-variant-numeric:tabular-nums}
.mlab{font-size:12px;color:var(--muted);margin-bottom:3px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--border);padding:3px 4px;text-align:left}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
.small{font-size:12px;color:var(--muted)}
.expl{font-size:13px;min-height:40px}
</style>
</head>
<body>
<div class="wrap">
<h3>固定大小的“记忆矩阵” S：一个 token 一个 token 地写入</h3>
<div class="tabs">
  <button id="mLin" class="on">线性注意力</button>
  <button id="mMb">Mamba-2（加遗忘门 γ）</button>
  <button id="mGd">Gated DeltaNet（γ + 写入门 β + 擦除）</button>
</div>
<div class="formula" id="fm"></div>
<div class="card">
  <div class="ctl" id="cg"><span>遗忘门 γ</span><input type="range" id="g" min="0.3" max="1" step="0.05" value="0.8"><b id="gv"></b></div>
  <div class="ctl" id="cb"><span>写入门 β</span><input type="range" id="b" min="0" max="1" step="0.05" value="1"><b id="bv"></b></div>
  <div class="ctl"><span>场景</span><select id="sc">
    <option value="0">事实更新：A 先存“红”，后来改存“黄”</option>
    <option value="1">key 不正交：A 与 D 有重叠</option>
  </select></div>
  <div class="seq" id="seq"></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button id="step" class="on">写入下一个 token</button>
    <button id="play">自动播放</button>
    <button id="reset">清空记忆</button>
  </div>
</div>
<div class="card">
  <div class="expl" id="expl"></div>
  <div class="mats" id="mats"></div>
</div>
<div class="card">
  <div style="font-weight:600;font-size:13px;margin-bottom:4px">读出测试：用每个 key 作为 query 去问记忆 y = qᵀS，能取回“最新的” value 吗？</div>
  <table id="rt"></table>
  <div class="small" id="dual" style="margin-top:6px"></div>
</div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var DK=4, mode="lin", t=0, S, timer=null, hist=[];
  var COL={"红":[1,0,0,0],"绿":[0,1,0,0],"蓝":[0,0,1,0],"黄":[0,0,0,1],"紫":[0.5,0,0.5,0]};
  function norm(v){ var s=Math.sqrt(v.reduce(function(a,x){return a+x*x;},0)); return v.map(function(x){return x/s;}); }
  var SCN=[
    [{n:"A",k:[1,0,0,0],v:"红"},{n:"B",k:[0,1,0,0],v:"绿"},{n:"C",k:[0,0,1,0],v:"蓝"},{n:"A",k:[1,0,0,0],v:"黄"},{n:"D",k:[0,0,0,1],v:"紫"}],
    [{n:"A",k:[1,0,0,0],v:"红"},{n:"B",k:[0,1,0,0],v:"绿"},{n:"D",k:norm([0.6,0,0,0.8]),v:"蓝"},{n:"C",k:[0,0,1,0],v:"黄"}]
  ];
  function seq(){ return SCN[+$("sc").value]; }
  function zeros(){ var m=[]; for(var i=0;i<DK;i++){ m.push([0,0,0,0]); } return m; }
  function copy(m){ return m.map(function(r){return r.slice();}); }
  function outer(a,b){ return a.map(function(x){ return b.map(function(y){return x*y;}); }); }
  function readOut(q,M){ var y=[0,0,0,0]; for(var i=0;i<DK;i++) for(var j=0;j<4;j++) y[j]+=q[i]*M[i][j]; return y; }
  function G(){ return +$("g").value; } function Bt(){ return +$("b").value; }
  function update(M,k,v){
    var out=zeros(), i, j;
    if(mode==="lin"){ for(i=0;i<DK;i++) for(j=0;j<4;j++) out[i][j]=M[i][j]+k[i]*v[j]; }
    else if(mode==="mb"){ var g=G(); for(i=0;i<DK;i++) for(j=0;j<4;j++) out[i][j]=g*M[i][j]+k[i]*v[j]; }
    else {
      var g2=G(), b=Bt();
      // (I - b k k^T) M
      var kM=readOut(k,M); // k^T M  (row vector, d_v)
      for(i=0;i<DK;i++) for(j=0;j<4;j++) out[i][j]=g2*(M[i][j]-b*k[i]*kM[j])+b*k[i]*v[j];
    }
    return out;
  }
  function cell(x){
    var a=Math.min(1,Math.abs(x)), rgb=getComputedStyle(document.documentElement).getPropertyValue(x>=0?"--pos":"--neg").trim();
    return "<div style='background:rgba("+rgb+","+(a*0.85)+");color:"+(a>0.55?"#fff":"inherit")+"'>"+(Math.abs(x)<0.005?"0":x.toFixed(2))+"</div>";
  }
  function matHTML(M,label,cols){
    cols=cols||4;
    var h="<div><div class='mlab'>"+label+"</div><div class='mat' style='grid-template-columns:repeat("+cols+",34px)'>";
    M.forEach(function(r){ r.forEach(function(x){ h+=cell(x); }); });
    return h+"</div></div>";
  }
  function formula(){
    var f={lin:"S_t = S_{t-1} + k_t v_tᵀ　　y_t = q_tᵀ S_t　（只加不减，越积越多）",
           mb:"S_t = γ_t · S_{t-1} + k_t v_tᵀ　　（γ_t 由当前输入决定；这里用滑块固定）",
           gd:"S_t = γ_t (I − β_t k_t k_tᵀ) S_{t-1} + β_t k_t v_tᵀ　（先擦掉 k_t 方向上的旧内容，再写入）"}[mode];
    $("fm").textContent=f;
    $("cg").style.display = mode==="lin"?"none":"flex";
    $("cb").style.display = mode==="gd"?"flex":"none";
    $("gv").textContent=G().toFixed(2); $("bv").textContent=Bt().toFixed(2);
  }
  function reset(){ S=zeros(); t=0; hist=[]; render(null,null); }
  function step(){
    var sq=seq(); if(t>=sq.length) return;
    var tok=sq[t], prev=copy(S), v=COL[tok.v];
    S=update(S,tok.k,v); hist.push({tok:tok,prev:prev}); t++;
    render(prev,tok);
  }
  function render(prev,tok){
    formula();
    var sq=seq();
    $("seq").innerHTML=sq.map(function(x,i){ return "<span class='tk "+(i<t-1?"done":"")+(i===t-1?" cur":"")+"'>t"+(i+1)+"：key "+x.n+" → "+x.v+"</span>"; }).join("");
    $("step").disabled = t>=sq.length;
    var m="";
    if(tok){
      var v=COL[tok.v];
      m+=matHTML(tok.k.map(function(x){return [x];}),"k_t（"+tok.n+"）",1);
      m+=matHTML([v],"v_t（"+tok.v+"）",4);
      m+=matHTML(prev,"写入前 S_{t-1}");
      m+=matHTML(S,"写入后 S_t");
      var ex={lin:"把外积 k_t v_tᵀ 直接加进 S。注意：同一个 key 写两次，旧值不会消失，会和新值叠加。",
              mb:"先把整个旧记忆乘以 γ = "+G().toFixed(2)+"（所有内容一起变淡），再加入新外积。",
              gd:"先读出 S 在 k_t 方向上已存的旧值，按 β 把它擦掉，再按 β 写入新值；其他方向几乎不受影响，最后整体乘 γ。"}[mode];
      $("expl").innerHTML="第 "+t+" 步：写入 key "+tok.n+" → "+tok.v+"。"+ex;
    } else {
      m+=matHTML(S,"记忆 S（d_k × d_v = 4 × 4，大小永远不变）");
      $("expl").innerHTML="记忆是一个固定大小的矩阵。不论序列多长，推理时只需要保存它——这就是线性注意力 / SSM 在长序列上省内存的原因。点击“写入下一个 token”。";
    }
    $("mats").innerHTML=m;
    // readout
    var latest={}, order=[];
    for(var i=0;i<t;i++){ var x=sq[i]; if(!(x.n in latest)) order.push(x.n); latest[x.n]=x; }
    var h="<tr><th>query</th><th>读出 y = kᵀS</th><th>应取回</th><th>误差</th></tr>";
    order.forEach(function(n){
      var it=latest[n], y=readOut(it.k,S), tv=COL[it.v];
      var err=Math.sqrt(y.reduce(function(a,yy,j){return a+(yy-tv[j])*(yy-tv[j]);},0));
      h+="<tr><td>key "+n+"</td><td style='font-family:monospace'>["+y.map(function(z){return z.toFixed(2);}).join(", ")+"]</td><td>"+it.v+" ["+tv.join(",")+"]</td><td class='"+(err<0.15?"ok":"no")+"'>"+err.toFixed(2)+"</td></tr>";
    });
    if(!order.length) h+="<tr><td colspan='4' class='small'>还没有写入任何内容</td></tr>";
    $("rt").innerHTML=h;
    // duality check
    if(t>0 && mode!=="gd"){
      var diff=dual();
      $("dual").innerHTML="并行形式检查：用“下三角掩码的 (QKᵀ ⊙ 衰减)V”一次性算出所有 y_t，与上面逐步递推的结果最大差 = <b>"+diff.toExponential(1)+"</b>（两种算法完全等价：训练用并行形式，推理用递推形式）。";
    } else if(mode==="gd"){
      $("dual").textContent="Gated DeltaNet 也有可并行的分块训练算法，但推导更复杂，这里只演示递推形式。";
    } else $("dual").textContent="";
  }
  function dual(){
    // queries q_t = k_t ; recurrent y_t vs parallel
    var sq=seq().slice(0,t), n=sq.length, g=(mode==="mb")?G():1;
    var Sr=zeros(), yr=[];
    for(var i=0;i<n;i++){ var v=COL[sq[i].v]; for(var a=0;a<DK;a++) for(var b=0;b<4;b++) Sr[a][b]=g*Sr[a][b]+sq[i].k[a]*v[b]; yr.push(readOut(sq[i].k,Sr)); }
    var mx=0;
    for(i=0;i<n;i++){
      var y=[0,0,0,0];
      for(var j=0;j<=i;j++){
        var s=0; for(a=0;a<DK;a++) s+=sq[i].k[a]*sq[j].k[a];
        s*=Math.pow(g,i-j);
        var vj=COL[sq[j].v]; for(b=0;b<4;b++) y[b]+=s*vj[b];
      }
      for(b=0;b<4;b++) mx=Math.max(mx,Math.abs(y[b]-yr[i][b]));
    }
    return mx;
  }
  function setMode(m,btn){ mode=m; if(m==="mb") $("g").value=0.8; if(m==="gd"){ $("g").value=1; $("b").value=1; } ["mLin","mMb","mGd"].forEach(function(id){$(id).className="";}); btn.className="on"; replay(); }
  function replay(){ var n=t; S=zeros(); t=0; hist=[]; var last=null, prev=null; var sq=seq(); for(var i=0;i<n&&i<sq.length;i++){ prev=copy(S); S=update(S,sq[i].k,COL[sq[i].v]); t++; last=sq[i]; } render(last?prev:null,last); }
  $("mLin").onclick=function(){ setMode("lin",this); };
  $("mMb").onclick=function(){ setMode("mb",this); };
  $("mGd").onclick=function(){ setMode("gd",this); };
  $("g").oninput=replay; $("b").oninput=replay;
  $("sc").onchange=reset;
  $("step").onclick=step;
  $("reset").onclick=reset;
  $("play").onclick=function(){
    var b=this;
    if(timer){ clearInterval(timer); timer=null; b.textContent="自动播放"; return; }
    reset(); b.textContent="停止";
    timer=setInterval(function(){ if(t>=seq().length){ clearInterval(timer); timer=null; b.textContent="自动播放"; return; } step(); },1300);
  };
  reset();
})();
</script>
</body>
</html>
