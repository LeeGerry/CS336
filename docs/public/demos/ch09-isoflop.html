<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinchilla IsoFLOP 交互</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#656d76;--card:#f6f8fa;--border:#d0d7de;--accent:#2563eb;--accent2:#ea580c;--good:#16a34a;--bad:#dc2626;--grid:#e5e7eb}
@media (prefers-color-scheme: dark){:root{--bg:#1b1b1f;--fg:#e6edf3;--muted:#9aa4af;--card:#24262b;--border:#3a3f47;--accent:#60a5fa;--accent2:#fb923c;--good:#4ade80;--bad:#f87171;--grid:#30363d}}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--muted);font-size:12.5px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin:8px 0}
.controls label{display:block;font-size:13px}.controls label input[type=range],.controls label select{display:block;width:100%;margin-top:2px}
input[type=range]{width:100%}
select{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--border)}
svg{width:100%;height:auto;display:block}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:10px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
.stat b{display:block;font-size:16px}
.bad{color:var(--bad)}.good{color:var(--good)}
</style>
</head>
<body>
<h3>IsoFLOP：固定算力预算，在"模型大小 N"和"训练 token 数 D"之间分配</h3>
<div class="muted">约束 C ≈ 6·N·D。损失模型 L(N,D) = E + A/N<sup>α</sup> + B/D<sup>β</sup>。拖动 N：模型变大，能喂的数据就变少。每条曲线是一个固定预算，曲线底部就是该预算下的最优模型。</div>
<div class="controls">
  <label>拟合参数
    <select id="ps">
      <option value="epoch">Chinchilla 方法 3 重新拟合（Besiroglu 等 2024）</option>
      <option value="orig">Chinchilla 论文原始方法 3 拟合</option>
    </select>
  </label>
  <label>算力预算 C = 10^<span id="cV"></span> FLOPs<input id="c" type="range" min="18" max="25" step="0.01" value="21"></label>
  <label>模型参数量 N = <span id="nV"></span><input id="n" type="range" min="7" max="12.5" step="0.01" value="9"></label>
</div>
<div class="row">
  <button id="opt">跳到当前预算的最优 N</button>
  <button class="sec" id="gopher">Gopher 配置（280B 参数, 300B token）</button>
  <button class="sec" id="chin">Chinchilla 配置（70B 参数, 1.4T token）</button>
</div>
<div class="grid2">
  <svg id="p1" viewBox="0 0 440 330"></svg>
  <svg id="p2" viewBox="0 0 300 330"></svg>
</div>
<div class="stats">
  <div class="stat"><span class="muted">当前 N / D</span><b id="sND">-</b></div>
  <div class="stat"><span class="muted">每参数 token 数 D/N</span><b id="sR">-</b></div>
  <div class="stat"><span class="muted">当前损失</span><b id="sL">-</b></div>
  <div class="stat"><span class="muted">该预算的最优 N* / D*</span><b id="sOpt">-</b></div>
  <div class="stat"><span class="muted">最优点 D*/N*，损失</span><b id="sOR">-</b></div>
  <div class="stat"><span class="muted">相对最优：损失差 / 推理成本</span><b id="sGap">-</b></div>
</div>
<p class="muted" id="note"></p>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const PS={orig:{E:1.69,A:406.4,B:410.7,al:0.34,be:0.28},epoch:{E:1.8172,A:482.01,B:2085.43,al:0.3478,be:0.3658}};
  const fmt=x=>x>=1e12?(x/1e12).toFixed(2)+'T':x>=1e9?(x/1e9).toFixed(x>=1e11?0:1)+'B':x>=1e6?(x/1e6).toFixed(0)+'M':x.toExponential(1);
  function P(){return PS[$('ps').value];}
  function loss(N,D){const p=P();return p.E+p.A/Math.pow(N,p.al)+p.B/Math.pow(D,p.be);}
  function nopt(C){const p=P();const G=Math.pow(p.al*p.A/(p.be*p.B),1/(p.al+p.be));return G*Math.pow(C/6,p.be/(p.al+p.be));}
  const budgets=[18,19,20,21,22,23,24,25];
  function draw(){
    const lc=+$('c').value,C=Math.pow(10,lc),ln=+$('n').value,N=Math.pow(10,ln),D=C/(6*N);
    $('cV').textContent=lc.toFixed(2);$('nV').textContent=fmt(N);
    // ---- plot1 ----
    const W=440,H=330,ml=44,mr=10,mt=10,mb=40;
    const X0=7,X1=12.5,Y0=1.85,Y1=4.2;
    const sx=x=>ml+(x-X0)/(X1-X0)*(W-ml-mr), sy=y=>mt+(1-(Math.min(Math.max(y,Y0),Y1+0.3)-Y0)/(Y1-Y0))*(H-mt-mb);
    let s='';
    for(let x=7;x<=12;x++){s+=`<line x1="${sx(x)}" x2="${sx(x)}" y1="${mt}" y2="${H-mb}" stroke="var(--grid)"/><text x="${sx(x)}" y="${H-mb+14}" font-size="10" text-anchor="middle" fill="var(--muted)">${fmt(Math.pow(10,x))}</text>`;}
    for(let y=2;y<=4;y+=0.5){s+=`<line x1="${ml}" x2="${W-mr}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--grid)"/><text x="${ml-4}" y="${sy(y)+3}" font-size="10" text-anchor="end" fill="var(--muted)">${y.toFixed(1)}</text>`;}
    s+=`<text x="${(ml+W)/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--muted)">模型参数量 N（对数）</text>`;
    s+=`<text x="11" y="${(mt+H-mb)/2}" font-size="11" text-anchor="middle" fill="var(--muted)" transform="rotate(-90 11 ${(mt+H-mb)/2})">最终损失</text>`;
    s+=`<defs><clipPath id="cp"><rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}"/></clipPath></defs><g clip-path="url(#cp)">`;
    const mins=[];
    budgets.forEach((b,k)=>{
      const Cb=Math.pow(10,b);let d='';
      for(let x=X0;x<=X1;x+=0.02){const Nn=Math.pow(10,x),Dd=Cb/(6*Nn);if(Dd<1e6)break;const L=loss(Nn,Dd);d+=(d?'L':'M')+sx(x).toFixed(1)+','+sy(L).toFixed(1);}
      const t=k/(budgets.length-1);
      s+=`<path d="${d}" fill="none" stroke="hsl(${210-170*t},70%,55%)" stroke-width="1.3" opacity="0.75"/>`;
      const No=nopt(Cb);mins.push([Math.log10(No),loss(No,Cb/(6*No))]);
    });
    s+=`<path d="${mins.map((m,i)=>(i?'L':'M')+sx(m[0]).toFixed(1)+','+sy(m[1]).toFixed(1)).join('')}" fill="none" stroke="var(--fg)" stroke-dasharray="3 3" stroke-width="1"/>`;
    mins.forEach(m=>{s+=`<circle cx="${sx(m[0])}" cy="${sy(m[1])}" r="3" fill="var(--fg)"/>`;});
    // current budget curve
    let d='';for(let x=X0;x<=X1;x+=0.02){const Nn=Math.pow(10,x),Dd=C/(6*Nn);if(Dd<1e6)break;d+=(d?'L':'M')+sx(x).toFixed(1)+','+sy(loss(Nn,Dd)).toFixed(1);}
    s+=`<path d="${d}" fill="none" stroke="var(--accent2)" stroke-width="3"/>`;
    const No=nopt(C),Do=C/(6*No),Lo=loss(No,Do);
    s+=`<circle cx="${sx(Math.log10(No))}" cy="${sy(Lo)}" r="6" fill="none" stroke="var(--accent2)" stroke-width="2"/>`;
    const L=D>=1?loss(N,D):Infinity;
    s+=`<circle cx="${sx(ln)}" cy="${sy(L)}" r="6" fill="var(--accent)" stroke="#fff" stroke-width="1.5"/>`;
    s+=`</g>`;
    s+=`<text x="${W-mr-4}" y="${mt+12}" font-size="10" text-anchor="end" fill="var(--muted)">从上到下：1e18 → 1e25 FLOPs</text>`;
    s+=`<text x="${W-mr-4}" y="${mt+26}" font-size="10" text-anchor="end" fill="var(--accent2)">橙色粗线 = 当前预算</text>`;
    $('p1').innerHTML=s;
    // ---- plot2: N_opt & D_opt vs C ----
    const W2=300,H2=330,m2l=40,m2r=10,m2t=10,m2b=40;
    const a0=18,a1=25,b0=7,b1=14;
    const tx=x=>m2l+(x-a0)/(a1-a0)*(W2-m2l-m2r), ty=y=>m2t+(1-(y-b0)/(b1-b0))*(H2-m2t-m2b);
    let t='';
    for(let x=18;x<=25;x++){t+=`<line x1="${tx(x)}" x2="${tx(x)}" y1="${m2t}" y2="${H2-m2b}" stroke="var(--grid)"/>`; if(x%2===0)t+=`<text x="${tx(x)}" y="${H2-m2b+14}" font-size="10" text-anchor="middle" fill="var(--muted)">1e${x}</text>`;}
    for(let y=7;y<=14;y++){t+=`<line x1="${m2l}" x2="${W2-m2r}" y1="${ty(y)}" y2="${ty(y)}" stroke="var(--grid)"/><text x="${m2l-4}" y="${ty(y)+3}" font-size="10" text-anchor="end" fill="var(--muted)">1e${y}</text>`;}
    t+=`<text x="${(m2l+W2)/2}" y="${H2-6}" font-size="11" text-anchor="middle" fill="var(--muted)">算力 C</text>`;
    let dn='',dd='';
    for(let x=a0;x<=a1;x+=0.1){const Cc=Math.pow(10,x),n=nopt(Cc);dn+=(dn?'L':'M')+tx(x).toFixed(1)+','+ty(Math.log10(n)).toFixed(1);dd+=(dd?'L':'M')+tx(x).toFixed(1)+','+ty(Math.log10(Cc/6/n)).toFixed(1);}
    t+=`<path d="${dn}" stroke="var(--accent)" stroke-width="2" fill="none"/><path d="${dd}" stroke="var(--good)" stroke-width="2" fill="none"/>`;
    // Kaplan reference: N ∝ C^0.73 anchored at 1e18 point
    const n18=Math.log10(nopt(1e18));
    t+=`<line x1="${tx(18)}" y1="${ty(n18)}" x2="${tx(25)}" y2="${ty(n18+0.73*7)}" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
    t+=`<circle cx="${tx(lc)}" cy="${ty(Math.log10(No))}" r="4" fill="var(--accent)"/><circle cx="${tx(lc)}" cy="${ty(Math.log10(Do))}" r="4" fill="var(--good)"/>`;
    const p=P(),aN=p.be/(p.al+p.be);
    t+=`<g font-size="10"><text x="${m2l+6}" y="${m2t+12}" fill="var(--good)">D*（最优 token 数）∝ C^${(1-aN).toFixed(2)}</text><text x="${m2l+6}" y="${m2t+26}" fill="var(--accent)">N*（最优参数量）∝ C^${aN.toFixed(2)}</text><text x="${m2l+6}" y="${m2t+40}" fill="var(--bad)">虚线：Kaplan 的 N ∝ C^0.73</text></g>`;
    $('p2').innerHTML=t;
    // stats
    $('sND').textContent=fmt(N)+' / '+fmt(D);
    $('sR').textContent=(D/N).toFixed(1);
    $('sL').textContent=isFinite(L)?L.toFixed(3):'-';
    $('sOpt').textContent=fmt(No)+' / '+fmt(Do);
    $('sOR').textContent=(Do/No).toFixed(1)+'，'+Lo.toFixed(3);
    const gap=(L-Lo)/Lo*100;
    $('sGap').innerHTML=`<span class="${gap<0.5?'good':'bad'}">+${gap.toFixed(2)}%</span> / ${(N/No).toFixed(2)}×`;
    let note='';
    if(N<No*0.7) note=`你选了比最优更小的模型、喂了更多数据（"过度训练"）：训练损失略差 ${gap.toFixed(2)}%，但每次推理只需最优模型 ${(N/No*100).toFixed(0)}% 的计算量。如果模型要服务海量用户，这往往是划算的。`;
    else if(N>No*1.4) note=`模型太大、数据太少（数据饥饿）：同样的算力，换来更高的损失，推理还更贵——这正是 Chinchilla 指出的 GPT-3 / Gopher 时代的问题。`;
    else note='你在最优点附近。IsoFLOP 曲线底部通常很平：参数量偏离最优 1.5 倍左右，损失只差一点点。';
    if($('ps').value==='orig') note+=' 【当前是原始方法 3 拟合：注意 D*/N* 随预算增大不断变大，与方法 1、2 的"约 20 倍"结论不一致。】';
    $('note').textContent=note;
  }
  $('opt').onclick=()=>{$('n').value=Math.log10(nopt(Math.pow(10,+$('c').value))).toFixed(2);draw();};
  $('gopher').onclick=()=>{const C=6*280e9*300e9;$('c').value=Math.log10(C).toFixed(2);$('n').value=Math.log10(280e9).toFixed(2);draw();};
  $('chin').onclick=()=>{const C=6*70e9*1.4e12;$('c').value=Math.log10(C).toFixed(2);$('n').value=Math.log10(70e9).toFixed(2);draw();};
  ['c','n','ps'].forEach(id=>$(id).addEventListener('input',draw));
  draw();
})();
</script>
</body>
</html>
