<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>训练资源计算器</title>
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#6b7280;--card:#f5f7fa;--border:#d8dee4;--accent:#2563eb;--c1:#3b82f6;--c2:#f59e0b;--c3:#10b981;--c4:#a855f7;--good:#059669;--bad:#dc2626}
@media (prefers-color-scheme: dark){:root{--bg:#16181d;--fg:#e6e8eb;--muted:#9aa3ae;--card:#1f232a;--border:#363c45;--accent:#60a5fa;--c1:#60a5fa;--c2:#fbbf24;--c3:#34d399;--c4:#c084fc;--good:#34d399;--bad:#f87171}}
*{box-sizing:border-box}
select{max-width:100%}
label{max-width:100%}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{padding:12px;overflow-x:hidden}
h3{margin:0 0 6px;font-size:16px}
h4{margin:0 0 6px;font-size:14px}
.muted{color:var(--muted);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 12px}
.grid label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;margin-top:2px;width:100%}
input[type=range]{padding:0}
button{font:inherit;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--fg);cursor:pointer;font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.big{font-size:20px;font-weight:700}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.stat div{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.stat b{display:block;font-size:16px}
.stack{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--border);background:var(--bg);position:relative}
.stack span{display:block;height:100%;transition:width .2s}
.cap{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.steps{white-space:pre-wrap;line-height:1.7}
.ok{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<h3>训练资源计算器：FLOPs（6ND）与显存（每参数字节数）</h3>
<div class="row" style="margin-bottom:4px">
  <span class="muted">讲义例题：</span>
  <button id="ex1">70B 模型 × 15T token × 1024 张 H100</button>
  <button id="ex2">8 张 H100 用 AdamW 最大能训多大</button>
  <button id="ex3">按 Chinchilla 设 D = 20N</button>
</div>

<div class="card">
  <div class="grid">
    <label>参数量 N（单位：十亿 B）<input id="N" type="number" value="70" min="0.001" step="any"></label>
    <label>训练 token 数 D（单位：万亿 T）<input id="D" type="number" value="15" min="0.0001" step="any"></label>
    <label>GPU 型号
      <select id="gpu">
        <option value="h100">H100（bf16 稠密 989.5 TFLOP/s，80 GB）</option>
        <option value="b200">B200（bf16 稠密 2250 TFLOP/s，180 GB）</option>
        <option value="a100">A100（bf16 312 TFLOP/s，80 GB）</option>
        <option value="custom">自定义</option>
      </select></label>
    <label>GPU 数量<input id="G" type="number" value="1024" min="1" step="1"></label>
    <label>单卡峰值（TFLOP/s）<input id="peak" type="number" value="989.5" step="any"></label>
    <label>单卡显存（GB）<input id="mem" type="number" value="80" step="any"></label>
    <label>MFU（实际/标称算力）= <span id="mfuv" class="mono"></span><input id="mfu" type="range" min="0.05" max="0.9" step="0.01" value="0.5"></label>
    <label>精度与优化器方案
      <select id="scheme">
        <option value="mixed_adam">bf16 参数/梯度 + fp32 AdamW 状态（2+2+4+4=12 B）</option>
        <option value="master_adam">同上 + fp32 主权重副本（2+2+4+4+4=16 B）</option>
        <option value="fp32_adam">全 fp32 + AdamW（4+4+8=16 B）</option>
        <option value="mixed_adagrad">bf16 + fp32 AdaGrad 状态（2+2+4=8 B）</option>
        <option value="mixed_sgd">bf16 + 纯 SGD 无状态（2+2=4 B）</option>
        <option value="infer">仅推理：bf16 权重（2 B）</option>
      </select></label>
  </div>
</div>

<div class="card">
  <h4>① 算力：要训多久？</h4>
  <div class="stat">
    <div>总 FLOPs = 6ND<b id="oF" class="mono"></b></div>
    <div>集群每天可做 FLOPs<b id="oFD" class="mono"></b></div>
    <div>预计训练时间<b id="oDays"></b></div>
  </div>
  <div class="steps mono muted" id="s1"></div>
</div>

<div class="card">
  <h4>② 显存：装得下吗？（未计激活值）</h4>
  <div class="stack" id="stack"></div>
  <div class="legend" id="legend"></div>
  <div class="stat" style="margin-top:8px">
    <div>每参数字节数<b id="oBpp"></b></div>
    <div>模型训练状态总计<b id="oMem"></b></div>
    <div>集群总显存<b id="oCap"></b></div>
    <div>至少需要 GPU<b id="oMinG"></b></div>
    <div>这些 GPU 最多能装<b id="oMaxN"></b></div>
  </div>
  <div class="steps mono muted" id="s2"></div>
  <div class="muted">红线 = 集群总显存。激活值随 batch 大小和序列长度增长，没有计入，所以这里是“乐观上界”。</div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var GPUS={h100:[989.5,80],b200:[2250,180],a100:[312,80]};
  var SCHEMES={
    mixed_adam:[['参数 bf16',2],['梯度 bf16',2],['Adam 一阶矩 m (fp32)',4],['Adam 二阶矩 v (fp32)',4]],
    master_adam:[['参数 bf16',2],['梯度 bf16',2],['Adam m (fp32)',4],['Adam v (fp32)',4],['fp32 主权重',4]],
    fp32_adam:[['参数 fp32',4],['梯度 fp32',4],['Adam m (fp32)',4],['Adam v (fp32)',4]],
    mixed_adagrad:[['参数 bf16',2],['梯度 bf16',2],['AdaGrad 平方和 (fp32)',4]],
    mixed_sgd:[['参数 bf16',2],['梯度 bf16',2]],
    infer:[['权重 bf16',2]]
  };
  var COLORS=['--c1','--c2','--c3','--c4','--muted'];
  function sci(x){ if(!isFinite(x)) return '-'; var e=Math.floor(Math.log10(Math.abs(x))); var m=x/Math.pow(10,e); return m.toFixed(2)+'e'+e; }
  function bytes(b){ var u=['B','KB','MB','GB','TB','PB']; var i=0; while(b>=1000&&i<u.length-1){b/=1000;i++;} return b.toFixed(b<10?2:1)+' '+u[i]; }
  function params(n){ if(n>=1e12) return (n/1e12).toFixed(2)+' 万亿'; if(n>=1e9) return (n/1e9).toFixed(1)+' B（十亿）'; if(n>=1e6) return (n/1e6).toFixed(1)+' M'; return n.toFixed(0); }
  function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
  function calc(){
    var N=+$('N').value*1e9, D=+$('D').value*1e12, G=Math.max(1,Math.round(+$('G').value)), peak=+$('peak').value*1e12, mem=+$('mem').value*1e9, mfu=+$('mfu').value;
    $('mfuv').textContent=mfu.toFixed(2);
    var F=6*N*D, perDay=peak*mfu*G*86400, days=F/perDay;
    $('oF').textContent=sci(F); $('oFD').textContent=sci(perDay);
    $('oDays').textContent=days<1?(days*24).toFixed(1)+' 小时':days.toFixed(1)+' 天';
    $('s1').textContent='6 × N × D = 6 × '+sci(N)+' × '+sci(D)+' = '+sci(F)+' FLOPs\n'+
      '每天 = 单卡 '+sci(peak)+' FLOP/s × MFU '+mfu.toFixed(2)+' × '+G+' 张 × 86400 秒 = '+sci(perDay)+'\n'+
      '天数 = '+sci(F)+' ÷ '+sci(perDay)+' ≈ '+days.toFixed(1);
    var sc=SCHEMES[$('scheme').value], bpp=sc.reduce(function(a,p){return a+p[1];},0);
    var total=N*bpp, cap=mem*G, scale=Math.max(total,cap);
    var h='', lg='';
    sc.forEach(function(p,i){ var c=css(COLORS[i%COLORS.length]); h+='<span title="'+p[0]+'" style="width:'+(N*p[1]/scale*100).toFixed(2)+'%;background:'+c+'"></span>'; lg+='<span><i style="background:'+c+'"></i>'+p[0]+' '+p[1]+'B × N = '+bytes(N*p[1])+'</span>'; });
    h+='<div class="cap" style="left:calc('+(cap/scale*100).toFixed(2)+'% - 1px)"></div>';
    $('stack').innerHTML=h; $('legend').innerHTML=lg;
    $('oBpp').textContent=bpp+' 字节'; $('oMem').textContent=bytes(total); $('oCap').textContent=bytes(cap);
    var minG=Math.ceil(total/mem);
    $('oMinG').innerHTML=minG+' 张 '+(minG<=G?'<span class="ok">✓ 够</span>':'<span class="bad">✗ 不够</span>');
    $('oMaxN').textContent=params(cap/bpp)+' 参数';
    $('s2').textContent='每参数 '+sc.map(function(p){return p[1];}).join(' + ')+' = '+bpp+' 字节\n'+
      '总计 = '+sci(N)+' × '+bpp+' = '+bytes(total)+'；集群 = '+G+' × '+bytes(mem)+' = '+bytes(cap)+'\n'+
      '最大参数量 = '+bytes(cap)+' ÷ '+bpp+' ≈ '+params(cap/bpp);
  }
  function setGPU(){ var g=GPUS[$('gpu').value]; if(g){$('peak').value=g[0];$('mem').value=g[1];} calc(); }
  $('gpu').onchange=setGPU;
  ['N','D','G','peak','mem','mfu','scheme'].forEach(function(id){ $(id).addEventListener('input',function(){ if(id==='peak'||id==='mem') $('gpu').value='custom'; calc(); }); });
  $('scheme').onchange=calc;
  $('ex1').onclick=function(){ $('N').value=70;$('D').value=15;$('gpu').value='h100';$('G').value=1024;$('mfu').value=0.5;$('scheme').value='mixed_adam';setGPU(); };
  $('ex2').onclick=function(){ $('gpu').value='h100';$('G').value=8;$('scheme').value='mixed_adam';$('N').value=53;setGPU(); };
  $('ex3').onclick=function(){ $('D').value=(+$('N').value*20/1000).toPrecision(3); calc(); };
  window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',calc);
  calc();
})();
</script>
</body>
</html>
