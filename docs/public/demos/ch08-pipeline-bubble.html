<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线气泡时间线</title>
<style>
:root{ --bg:#ffffff; --panel:#f5f6f8; --fg:#1d2330; --muted:#667085; --line:#d0d5dd; --accent:#2563eb;
  --F:#2563eb; --B:#16a34a; --W:#9333ea; --idle:#f1d4d4; --track:#e5e7eb; }
@media (prefers-color-scheme: dark){
  :root{ --bg:#111418; --panel:#1b2027; --fg:#e6e9ef; --muted:#98a2b3; --line:#344054; --accent:#60a5fa;
    --F:#3b82f6; --B:#22c55e; --W:#a855f7; --idle:#4a2a2e; --track:#2a313c; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:16px;margin:0 0 8px}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:5px 9px;border-radius:6px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
label{display:block;font-size:12.5px;color:var(--muted)}
label b{color:var(--fg)}
input[type=range]{width:100%}
svg{width:100%;height:auto;display:block;background:var(--panel);border-radius:10px;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
@media (max-width:480px){ .stats{grid-template-columns:repeat(2,1fr)} }
.stat{background:var(--panel);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--muted)}
.stat b{display:block;color:var(--fg);font-size:15px}
.card{background:var(--panel);border-radius:10px;padding:10px;margin-top:8px;font-size:13px;line-height:1.65}
.ctrl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>流水线并行的“气泡”：时间线动画</h1>
  <div class="tabs" id="tabs"></div>
  <div class="grid">
    <div><label>流水线段数 p（GPU 数）：<b id="vP"></b></label><input id="P" type="range" min="2" max="8" value="4"></div>
    <div><label>微批次数 m：<b id="vM"></b></label><input id="M" type="range" min="1" max="16" value="8"></div>
  </div>
  <svg id="svg" viewBox="0 0 700 260"></svg>
  <div class="legend"><span style="--c:var(--F)">前向 F</span><span style="--c:var(--B)" id="lgB">反向 B（耗时 2）</span><span style="--c:var(--W)" id="lgW">权重梯度 W</span><span style="--c:var(--idle)">空闲（气泡）</span></div>
  <div class="ctrl"><button id="play">▶ 播放</button><button id="reset">⟲ 重置</button><button id="end">⏭ 直接看结果</button></div>
  <div class="stats" id="stats"></div>
  <div class="card" id="desc"></div>
</div>
<script>
(function(){
  var SCHED=[{k:"naive",n:"朴素：不切微批"},{k:"gpipe",n:"GPipe：先全前向再全反向"},{k:"1f1b",n:"1F1B：一前一后交替"},{k:"zb",n:"零气泡：拆开 B 与 W"}];
  var cur="1f1b", blocks=[], T=0, cursor=0, playing=false, raf=null, peak=[];
  function $(id){return document.getElementById(id);}
  SCHED.forEach(function(s){var b=document.createElement("button");b.textContent=s.n;b.dataset.k=s.k;b.onclick=function(){cur=s.k;rebuild();};$("tabs").appendChild(b);});

  // ---- 调度模拟：离散时间，每段每个时刻最多执行一个任务 ----
  function simulate(p,m,k){
    var naive = k==="naive";
    var nm = naive?1:m, fd = naive?m:1, bd = (k==="zb")?1:2*(naive?m:1), wd=1;
    var hasW = k==="zb";
    var fEnd=[],bEnd=[],wEnd=[],fStart=[],bStart=[],wStart=[];
    for(var s=0;s<p;s++){fEnd.push([]);bEnd.push([]);wEnd.push([]);fStart.push(0);bStart.push(0);wStart.push(0);}
    var busy=new Array(p).fill(0), out=[], t=0, inflight=new Array(p).fill(0), pk=new Array(p).fill(0), live=new Array(p).fill(0);
    var total = p*nm*(hasW?3:2), done=0;
    while(done<total && t<5000){
      for(var s=0;s<p;s++){
        if(busy[s]>t) continue;
        var cand=[];
        var i=fStart[s];
        if(i<nm){ var depOk = s===0 || (fEnd[s-1][i]!==undefined && fEnd[s-1][i]<=t);
          var limOk = true;
          if(k==="1f1b"||k==="zb") limOk = (fStart[s]-bStart[s]) < (p-s);
          if(depOk&&limOk) cand.push("F"); }
        var j=bStart[s];
        if(j<nm){ var dep = s===p-1 ? (fEnd[s][j]!==undefined && fEnd[s][j]<=t) : (bEnd[s+1][j]!==undefined && bEnd[s+1][j]<=t);
          if(k==="gpipe"||naive) dep = dep && fStart[s]>=nm && fEnd[s][nm-1]<=t;
          if(dep) cand.push("B"); }
        var w=wStart[s];
        if(hasW && w<nm && bEnd[s][w]!==undefined && bEnd[s][w]<=t) cand.push("W");
        if(!cand.length) continue;
        var pick;
        if(k==="gpipe"||naive) pick = cand.indexOf("F")>=0?"F":cand[0];
        else pick = cand.indexOf("B")>=0?"B":(cand.indexOf("F")>=0?"F":"W");
        var d = pick==="F"?fd:(pick==="B"?bd:wd), idx;
        if(pick==="F"){ idx=fStart[s]++; fEnd[s][idx]=t+d; live[s]++; pk[s]=Math.max(pk[s],live[s]); }
        else if(pick==="B"){ idx=bStart[s]++; bEnd[s][idx]=t+d; if(!hasW) live[s]--; }
        else { idx=wStart[s]++; wEnd[s][idx]=t+d; live[s]--; }
        busy[s]=t+d; done++;
        out.push({s:s,type:pick,i:idx,t0:t,t1:t+d});
      }
      t++;
    }
    var end=0; out.forEach(function(b){end=Math.max(end,b.t1);});
    return {blocks:out,T:end,peak:pk,nm:nm,work:nm*(fd+(hasW?bd+wd:bd))};
  }

  var res=null;
  function rebuild(){
    stop();
    var p=+$("P").value, m=+$("M").value;
    $("vP").textContent=p; $("vM").textContent=m+(cur==="naive"?"（朴素模式下整批当 1 个）":"");
    var bs=document.querySelectorAll("#tabs button"); for(var i=0;i<bs.length;i++) bs[i].className=bs[i].dataset.k===cur?"on":"";
    res=simulate(p,m,cur); cursor=0;
    $("lgB").textContent = cur==="zb" ? "B：只回传输入梯度（耗时 1）" : "反向 B（耗时 2）";
    $("lgW").style.display = cur==="zb" ? "" : "none";
    draw(); stats(p,m);
    var D={
      naive:"不切微批：整批数据先在 GPU 0 前向，再交给 GPU 1……反向再一路传回来。任意时刻只有一张卡在干活，利用率只有 1/p，其余全是气泡。",
      gpipe:"GPipe：把 batch 切成 m 个微批，前向像流水线一样依次流过各段，全部前向结束后再统一反向。气泡只出现在开头的“填充”和结尾的“排空”阶段，比例 = (p−1)/(m+p−1)。缺点：每段要同时存 m 个微批的激活（看“峰值激活”）。",
      "1f1b":"1F1B：热身阶段先做几次前向，之后每做一次前向就做一次反向。总时长和气泡与 GPipe 相同，但第 s 段最多只同时存 p−s 个微批的激活，显存大幅下降。这是 Megatron 等框架的默认做法。",
      zb:"零气泡（Zero Bubble）：把反向拆成两半：B 只计算“对输入的梯度”，下一段马上要用，必须尽快做；W 计算“对权重的梯度”，谁也不等它，可以拖到空闲时再做，用来填补气泡。代价是调度更复杂，W 拖得越久，激活要存得越久。"
    };
    $("desc").innerHTML=D[cur]+"<br><span style='color:var(--muted)'>提示：把 m 拉大，气泡占比下降，这就是“流水线需要大 batch”的原因；把 p 拉大，气泡占比上升。</span>";
  }
  function stats(p,m){
    var busyTot=0; res.blocks.forEach(function(b){busyTot+=b.t1-b.t0;});
    var frac = 1-busyTot/(p*res.T);
    var theory = cur==="naive" ? (p-1)/p : (p-1)/(m+p-1);
    var thLab = cur==="zb" ? "（1F1B 理论值，零气泡应更低）" : "";
    $("stats").innerHTML =
      "<div class='stat'>总时长<b>"+res.T+" 个时间单位</b></div>"+
      "<div class='stat'>气泡占比（模拟）<b>"+(frac*100).toFixed(1)+"%</b></div>"+
      "<div class='stat'>理论 (p−1)/(m+p−1)"+thLab+"<b>"+(theory*100).toFixed(1)+"%</b></div>"+
      "<div class='stat'>讲义里的比值 (p−1)/m<b>"+(cur==="naive"?"—":((p-1)/m).toFixed(2))+"</b></div>"+
      "<div class='stat'>峰值激活：GPU 0 存了几个微批<b>"+res.peak[0]+(cur==="naive"?"（整批）":"")+"</b></div>"+
      "<div class='stat'>峰值激活：最后一段<b>"+res.peak[p-1]+"</b></div>";
  }
  var svg=$("svg"), NS="http://www.w3.org/2000/svg";
  function el(t,a,par){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);par.appendChild(e);return e;}
  function draw(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var p=+$("P").value, left=58, right=690, top=12, rowH=Math.min(46, 220/p), W=right-left;
    var H = top + p*rowH + 28;
    svg.setAttribute("viewBox","0 0 700 "+H);
    var u = W/res.T;
    for(var s=0;s<p;s++){
      var y=top+s*rowH;
      el("rect",{x:left,y:y+2,width:Math.min(W, cursor*u),height:rowH-4,fill:"var(--idle)"},svg);
      el("rect",{x:left,y:y+2,width:W,height:rowH-4,fill:"none",stroke:"var(--line)"},svg);
      var tx=el("text",{x:6,y:y+rowH/2+4,"font-size":"12",fill:"var(--fg)"},svg); tx.textContent="GPU "+s;
    }
    res.blocks.forEach(function(b){
      if(b.t0>=cursor) return;
      var x=left+b.t0*u, w=(Math.min(b.t1,cursor)-b.t0)*u, y=top+b.s*rowH;
      el("rect",{x:x+0.5,y:y+3,width:Math.max(0,w-1),height:rowH-6,rx:2,fill:"var(--"+b.type+")"},svg);
      if((b.t1-b.t0)*u>=13 && b.t1<=cursor){ var t=el("text",{x:x+(b.t1-b.t0)*u/2,y:y+rowH/2+4,"text-anchor":"middle","font-size":Math.min(11,rowH*0.42),fill:"#fff"},svg); t.textContent=String(b.i+1); }
    });
    // 时间轴
    var ay=top+p*rowH+6;
    el("line",{x1:left,y1:ay,x2:right,y2:ay,stroke:"var(--muted)"},svg);
    var lab=el("text",{x:right,y:ay+16,"text-anchor":"end","font-size":"11",fill:"var(--muted)"},svg); lab.textContent="时间 →（共 "+res.T+" 单位）";
    if(cursor<res.T) el("line",{x1:left+cursor*u,y1:top,x2:left+cursor*u,y2:ay,stroke:"var(--accent)","stroke-width":"2"},svg);
  }
  var last=null;
  function frame(ts){
    if(!playing) return;
    if(last===null) last=ts;
    var speed = res.T/6;  // 约 6 秒播完
    cursor=Math.min(res.T, cursor+(ts-last)/1000*speed); last=ts;
    draw();
    if(cursor>=res.T){ stop(); return; }
    raf=requestAnimationFrame(frame);
  }
  function stop(){ playing=false; last=null; if(raf) cancelAnimationFrame(raf); $("play").textContent="▶ 播放"; }
  $("play").onclick=function(){ if(playing){stop();return;} if(cursor>=res.T) cursor=0; playing=true; $("play").textContent="⏸ 暂停"; raf=requestAnimationFrame(frame); };
  $("reset").onclick=function(){ stop(); cursor=0; draw(); };
  $("end").onclick=function(){ stop(); cursor=res.T; draw(); };
  $("P").addEventListener("input",rebuild); $("M").addEventListener("input",rebuild);
  rebuild(); cursor=res.T; draw();
})();
</script>
</body>
</html>
